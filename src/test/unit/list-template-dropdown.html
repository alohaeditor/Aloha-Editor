<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<title>Aloha Editor List Template Dropdown Test Suite</title>
	<!-- include qunit -->
	<link rel="stylesheet" href="../vendor/qunit.css" type="text/css"/>
	<script type="text/javascript" src="../vendor/qunit.js"></script>
	<script	src="../../lib/vendor/jquery-3.7.0.js" ></script>
	<!-- include aloha -->
	<script>
		var Aloha = {
			settings: {
				jQuery: $,
				baseUrl: '../../lib',
				plugins: {
					list: {
						// templates only for ordered lists, none for unordered lists,
						// definition lists not configured at all
						templates: {
							ol: [
								{ label: 'Roman', classes: ['aloha-list-lower-roman'] }
							],
							ul: []
						}
					}
				}
			}
		};
	</script>
	<script src="../../lib/require.js"></script>
	<script src="../../lib/aloha.js" data-aloha-plugins="common/ui,common/list"></script>
</head>
<body>
	<!-- include the tests -->
	<script>
		require( ['list-template-dropdown'] );
	</script>
	<h1 id="qunit-header">Aloha Editor List Template Dropdown Test Suite</h1>
	<h2 id="qunit-banner"></h2>
	<div id="qunit-testrunner-toolbar"></div>
	<h2 id="qunit-userAgent"></h2>
	<ol id="qunit-tests"></ol>
	<div id="qunit-fixture"></div>
</body>
</html>
